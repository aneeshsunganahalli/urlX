upstream url_shortener {
    server server:8000;

}

server {
    listen 80;

    resolver 127.0.0.11 valid=5s;

    location /server/ {
        set $backend "http://server:8000";
        
        # This strips the "/server" part before sending it to FastAPI
        # E.g., user requests /server/db/health -> Nginx asks FastAPI for /db/health
        rewrite ^/server/(.*)$ /$1 break;
        
        proxy_pass $backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend "http://client:3000";
        proxy_pass $frontend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}