# Only for the CI/CD pipeline, checked by Github Actions
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: shortener_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d shortener_db"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    # Require the password that your server is expecting
    command: redis-server --requirepass dummy_password 
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  server:
    environment:
      DATABASE_URL: "postgresql+asyncpg://test_user:test_password@postgres:5432/shortener_db"
      WORKER_ID: "1"
      CUSTOM_EPOCH: "1704067200"
      CLIENT_URL: "http://localhost"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: "dummy_password"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy