# Only for the CI/CD pipeline, checked by Github Actions
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: shortener_db
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # We inject environment variables into your existing FastAPI container 
  # so it knows to talk to these new database containers instead of localhost
  server: # Note: Ensure this matches the exact name of your backend service in docker-compose.yml
    environment:
      
      - DATABASE_URL=postgresql+asyncpg://test_user:test_password@postgres:5432/shortener_db
      
      - WORKER_ID=1
      - CUSTOM_EPOCH=1704067200
      - CLIENT_URL=http://localhost
      
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=dummy_password
    depends_on:
      - postgres
      - redis