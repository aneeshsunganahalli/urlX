services:
  server:
    build: ./app
    env_file:
      - .env
    expose:
      - "8000"
    deploy:
      replicas: 5  # Spins up 5 identical instances
  
  client:
    build: 
      context: ./client
    env_file:
      - .env
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"  # This is the only port exposed to your machine/the internet
    volumes:
      # Mounts your custom config into the container, replacing the default
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
      - client